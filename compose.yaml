services:
    backend:
        build: ./backend
        ports:
            - "8080:8080"
        environment:
            SPRING_MONGODB_URI: mongodb://mongodb:27017/study_flow
        depends_on:
            mongodb:
                condition: service_healthy

    frontend:
        build: ./frontend
        ports:
            - "5173:5173"

    mongodb:
        image: mongo:8
        ports:
            - "27017:27017"
        volumes:
            - mongodb-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mongodb-data: